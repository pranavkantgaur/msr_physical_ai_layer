name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest-cov

      - name: Lint (ruff check)
        run: ruff check msr_physical_ai_mcp_server.py msr_robot_state.py

      - name: Format check (ruff format)
        run: ruff format --check msr_physical_ai_mcp_server.py msr_robot_state.py

      - name: Run tests with coverage
        run: |
          pytest test_msr_physical_ai_mcp_server.py -v \
            --cov=msr_physical_ai_mcp_server \
            --cov=msr_robot_state \
            --cov-report=term-missing \
            --cov-fail-under=70
